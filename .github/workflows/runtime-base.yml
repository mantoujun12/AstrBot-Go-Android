# Build the PRoot base image on ARM64 and smoke-test it.
# Pre-verifies the content side of P0 items 1-3 of docs/P0_VERIFICATION.md
# on plain Linux (no Android device needed): the rootfs boots, Python works
# inside it, and an offline wheelhouse install ships the WebUI dashboard.
# PRoot runs the checks when it works on the runner; GitHub's ARM64 runners
# currently run kernel 7.x where the distro PRoot (5.1.0) segfaults, so the
# checks fall back to chroot and PRoot itself stays an on-device gate.
name: runtime-base

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-base.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    # ARM64 native: no qemu emulation, matches the on-device target.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Produces dist/rootfs.tar.zst + dist/rootfs.tar.zst.sha256 + dist/manifest.json.
      - name: Build base image and export rootfs
        run: bash runtime/scripts/export-rootfs.sh dist

      - name: Install proot
        run: |
          sudo apt-get update
          sudo apt-get install -y proot

      - name: Verify checksum and extract rootfs
        run: |
          echo "$(cat dist/rootfs.tar.zst.sha256)  dist/rootfs.tar.zst" | sha256sum -c -
          mkdir -p /tmp/rootfs
          zstd -dc dist/rootfs.tar.zst | tar -C /tmp/rootfs -xf -

      # The image's Python is a uv-managed python-build-standalone tree;
      # resolve the exact interpreter path once and reuse it in the checks.
      - name: Resolve guest Python path
        run: |
          py_bin="$(find /tmp/rootfs/opt/python -type f -name python3.12 | head -n 1)"
          if [ -z "$py_bin" ]; then
            echo "::error::python3.12 not found under /tmp/rootfs/opt/python" >&2
            exit 1
          fi
          guest_py_dir="$(dirname "$py_bin")"
          guest_py_dir="${guest_py_dir#/tmp/rootfs}"
          echo "GUEST_PY_DIR=$guest_py_dir" >> "$GITHUB_ENV"
          echo "Guest Python: $guest_py_dir/python3.12"

      # Build every dependency into a wheel. astrbot deps include sdists
      # (e.g. aiocqhttp), so `pip download --only-binary` cannot work; the
      # offline install inside the guest needs wheels only.
      - name: Stage wheelhouse for astrbot 4.29.3
        run: |
          python3 -m venv /tmp/wheelstage
          /tmp/wheelstage/bin/pip wheel astrbot==4.29.3 -w /tmp/wheelhouse

      # P0 items 1-3: boot the rootfs, import stdlib modules, offline-install
      # astrbot and verify dashboard/dist. Prefer PRoot; fall back to chroot
      # (with bind mounts) when the runner's PRoot build is broken - the
      # PRoot launcher itself is verified on-device per P0_VERIFICATION.md.
      - name: Smoke test rootfs (PRoot, chroot fallback)
        run: |
          set -u
          if proot -r /tmp/rootfs /usr/bin/env /bin/true >/dev/null 2>&1; then
            mode="proot"
            RUNNER=(proot -r /tmp/rootfs)
            WHEEL_RUNNER=(proot -r /tmp/rootfs -b /tmp/wheelhouse:/opt/wheelhouse)
          else
            mode="chroot"
            echo "::warning::PRoot is broken on this runner (kernel $(uname -r)); using chroot. PRoot itself is verified on-device per docs/P0_VERIFICATION.md."
            sudo mount --bind /dev  /tmp/rootfs/dev
            sudo mount --bind /proc /tmp/rootfs/proc
            sudo mount --bind /sys  /tmp/rootfs/sys
            sudo mount --bind /tmp/wheelhouse /tmp/rootfs/opt/wheelhouse
            RUNNER=(sudo chroot /tmp/rootfs)
            WHEEL_RUNNER=(sudo chroot /tmp/rootfs)
          fi
          ENV_ARGS=(/usr/bin/env PATH="$GUEST_PY_DIR:/usr/local/bin:/usr/bin:/bin" PYTHONDONTWRITEBYTECODE=1)

          fail=0
          # Item 1: the rootfs executes and uv is on PATH.
          "${RUNNER[@]}" "${ENV_ARGS[@]}" \
            /bin/sh -c "cat /etc/debian_version && uv --version" || fail=1
          # Item 2a: Python stdlib imports work inside the guest.
          "${RUNNER[@]}" "${ENV_ARGS[@]}" \
            "$GUEST_PY_DIR/python3.12" -c "import ssl, sqlite3" || fail=1
          # Item 2b + 3: offline venv install from the wheelhouse and the
          # installed package ships the WebUI dashboard static assets.
          "${WHEEL_RUNNER[@]}" "${ENV_ARGS[@]}" \
            /usr/local/bin/uv venv /opt/astrbot-venv || fail=1
          "${WHEEL_RUNNER[@]}" "${ENV_ARGS[@]}" \
            /usr/local/bin/uv pip install \
              --python /opt/astrbot-venv/bin/python \
              --no-index --find-links /opt/wheelhouse \
              astrbot==4.29.3 || fail=1
          "${RUNNER[@]}" \
            /usr/bin/env PATH=/usr/local/bin:/usr/bin:/bin \
            /bin/sh -c "test -d /opt/astrbot-venv/lib/python3.12/site-packages/astrbot/dashboard/dist" || fail=1

          if [ "$fail" != 0 ]; then
            echo "::error::rootfs smoke checks failed (mode: $mode)"
            exit 1
          fi
          echo "All rootfs smoke checks passed (mode: $mode)."

      - name: Upload base image artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: dist/*
          if-no-files-found: error
